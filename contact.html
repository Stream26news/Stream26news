<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact — Stream26 News</title>
<link rel="icon" type="image/png" href="logo-mark.png">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,700&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{--paper:#fff;--ink:#141414;--ink-soft:#5A5A5A;--rule:#E4E4E4;--red:#E30613;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Public Sans',sans-serif;color:var(--ink);background:var(--paper);}
  .wrap{max-width:760px;margin:0 auto;padding:0 24px;}
  header{border-bottom:3px solid var(--ink);padding:24px 0;}
  header .wrap{display:flex;align-items:center;}
  header img{height:42px;}
  main{padding:48px 0 80px;}
  h1{font-family:'Fraunces',serif;font-weight:700;font-size:38px;margin-bottom:20px;}
  p{line-height:1.7;color:var(--ink-soft);margin-bottom:14px;font-size:15.5px;}
  a{color:var(--red);}
  a.back{display:inline-block;margin-top:36px;font-weight:600;}
  .box{background:#F6F6F6;border:1px solid var(--rule);border-radius:6px;padding:20px 24px;margin:24px 0;font-size:15px;}
</style>
</head>
<body>
<header><div class="wrap"><a href="index.html"><img src="logo-wide.png" alt="Stream26 News"></a></div></header>
<main class="wrap">
  <h1>Contact Us</h1>
  <p>Have a tip, correction, or partnership inquiry? We'd like to hear from you.</p>
  <div class="box">
    <strong>Editorial &amp; general inquiries:</strong><br>
    <a href="mailto:stream26news@gmail.com">stream26news@gmail.com</a>
  </div>
  <p>We aim to respond to editorial and correction requests within 3–5 business days.</p>
  <a class="back" href="index.html">← Back to Stream26 News</a>
</main>
<!-- Cloudflare Web Analytics — replace YOUR_TOKEN_HERE once enabled in the Cloudflare dashboard -->
<script defer src='https://static.cloudflareinsights.com/beacon.min.js' data-cf-beacon='{"token": "YOUR_TOKEN_HERE"}'></script>
</body>
</html>
